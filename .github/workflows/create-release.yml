# Calls a workflow that
# + creates a new release branch from develop,
# + raises version numbers semantically,
# + merges the release branch into main,
# + sets a version tag,
# + generates release notes from commits and contributors,
# + creates a support branch off the last release if necessary
# + and builds the release packages as an artifact.
#
# This workflow must be triggered manually.

name: Create & publish release from develop

on:
  workflow_dispatch:

jobs:
  release:
    uses: ZEISS-PiWeb/github-actions/.github/workflows/create-release.yml@main
    with:
      generate_release_notes: true
      dotnet_version: '10.0.x'
    secrets:
      PUSH_TO_GITHUB_REPO_PAT: ${{ secrets.PUSH_TO_GITHUB_REPO_PAT }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: package_output

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push package_output/*.nupkg
          --skip-duplicate
          --no-symbols
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
